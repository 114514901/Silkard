plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'io.github.goooler.shadow' version '8.1.8'
    id 'net.neoforged.gradleutils' version '4.0.1'
}

version = project.minecraft_version + "-" + gradleutils.gitInfo.abbreviatedId
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'mohistmc'
        url = 'https://maven.mohistmc.com/'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "silkard" {
            sourceSet sourceSets.main
        }
    }

}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation('com.mohistmc:json:0.5')
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }

    manifest {
        attributes(
                'Main-Class': 'com.mohistmc.launcher.silkard.SilkardLauncher',
                'Specification-Title'   : 'Silkard',
                'Specification-Vendor'  : 'MohistMC',
                'Specification-Version' : 'development',
                'Implementation-Title'  : 'Silkard',
                'Implementation-Version': version,
                'Implementation-Vendor' : 'MohistMC'
        )
    }
}

shadowJar {
    archiveClassifier = 'server'
    dependencies {
        include(dependency('com.mohistmc:json'))
    }
}

jar.dependsOn(shadowJar)